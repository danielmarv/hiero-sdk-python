name: TCK Runner Test

# Harness for the hiero-tck-runner action.
#
# The suite is sharded across jobs rather than run with mocha --parallel: each
# shard gets its OWN Solo network, so no network carries the whole suite's load.
# A single network run end-to-end trips the SDK's node-health breaker
# ("All nodes are unhealthy") and every later test fails for reasons that have
# nothing to do with SDK compatibility.
on:
  push:
    branches:
      - "tck-runner-test"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tck:
    name: TCK (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: crypto
            spec: "src/tests/crypto-service/*.ts"
          - shard: token-a
            spec: "src/tests/token-service/test-token-a*.ts src/tests/token-service/test-token-b*.ts src/tests/token-service/test-token-c*.ts src/tests/token-service/test-token-d*.ts src/tests/token-service/test-token-f*.ts src/tests/token-service/test-token-g*.ts"
          - shard: token-b
            spec: "src/tests/token-service/test-token-i*.ts src/tests/token-service/test-token-m*.ts src/tests/token-service/test-token-n*.ts src/tests/token-service/test-token-p*.ts src/tests/token-service/test-token-r*.ts src/tests/token-service/test-token-u*.ts src/tests/token-service/test-token-w*.ts"
          - shard: topic
            spec: "src/tests/topic-service/*.ts"
          - shard: contract-file
            spec: "src/tests/contract-service/*.ts src/tests/file-service/*.ts src/tests/ethereum/*.ts"
          - shard: schedule-node
            spec: "src/tests/schedule-service/*.ts src/tests/node-service/*.ts"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@v0.24.0
        with:
          installMirrorNode: true

      - name: Run TCK shard
        id: tck
        uses: danielmarv/hiero-tck-runner@Daniel
        with:
          dockerfilePath: ./tck/Dockerfile
          serverEnv: |
            TCK_PORT=8544
            TCK_HOST=0.0.0.0
          testSpec: ${{ matrix.spec }}
          artifactName: tck-report-${{ matrix.shard }}

      - name: Shard result
        if: always()
        run: |
          echo "shard=${{ matrix.shard }}"
          echo "passed=${{ steps.tck.outputs.passed }} / ${{ steps.tck.outputs.total }}"
          echo "genuineFailures=${{ steps.tck.outputs.genuineFailures }}"
          echo "infraFailures=${{ steps.tck.outputs.infraFailures }}"
          echo "skipped=${{ steps.tck.outputs.skipped }}"
          echo "unimplemented=${{ steps.tck.outputs.unimplementedMethods }}"
