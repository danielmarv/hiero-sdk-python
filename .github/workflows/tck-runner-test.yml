name: TCK Runner Test

# Manual/branch harness for exercising the hiero-tck-runner action.
on:
  push:
    branches:
      - "tck-runner-test"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tck:
    name: TCK (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          # Fast path: one method's spec file only, as an SDK author would run
          # while implementing it.
          - leg: targeted
            testSpec: "src/tests/crypto-service/test-account-create-transaction.ts"
            testScript: "test:serial"
          # Full suite in mocha's parallel mode, to compare against the serial
          # baseline of 922 passed / 231 failed / 21 hook failures / 470 skipped.
          - leg: parallel-full
            testSpec: ""
            testScript: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@v0.23.0
        with:
          installMirrorNode: true

      - name: Run TCK test
        id: tck
        uses: danielmarv/hiero-tck-runner@Daniel
        with:
          dockerfilePath: ./tck/Dockerfile
          serverEnv: |
            TCK_PORT=8544
            TCK_HOST=0.0.0.0
          testSpec: ${{ matrix.testSpec }}
          testScript: ${{ matrix.testScript }}
          artifactName: tck-report-${{ matrix.leg }}

      - name: Show TCK outputs
        if: always()
        run: |
          echo "leg=${{ matrix.leg }}"
          echo "total=${{ steps.tck.outputs.total }}"
          echo "passed=${{ steps.tck.outputs.passed }}"
          echo "failed=${{ steps.tck.outputs.failed }}"
          echo "pending=${{ steps.tck.outputs.pending }}"
          echo "hookFailures=${{ steps.tck.outputs.hookFailures }}"
          echo "skipped=${{ steps.tck.outputs.skipped }}"
          echo "registered=${{ steps.tck.outputs.registered }}"
